- name: Load OS family vars
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install apache
  ansible.builtin.package:
    name: "{{ service_app_pkg }}"
    state: present

- name: Enable and start apache
  ansible.builtin.systemd_service:
    name: "{{ service_app_unit }}"
    enabled: true
    state: started
