# agent 바이너리 fetch 방식.
# github_release: agent repo 의 GitHub Release 에서 download (정식 path)
# local_file    : controller (iac) 의 로컬 파일을 fleet 멤버 로 push (개발/PoC path)
agent_binary_source: "github_release"

# --- github_release path 변수 ---
agent_version: ""          # 예: "v1.2.3" 또는 dev tag
agent_release_repo: ""     # 예: "z-converter-assessment/assessment-agent"
agent_arch: "x86_64"       # agent dist asset 명명: assessment-agent-linux-x86_64

# --- local_file path 변수 ---
# controller (iac) 측 바이너리 절대 경로. 예: ~/agent-binaries/latest/assessment-agent-linux-x86_64
# 빌드 산출물은 ~/agent-binaries/<version>/ 으로 보관 + latest symlink 가리킴.
agent_binary_local_path: ""
# 무결성 검증용 sha256 hex. ~/agent-binaries/<version>/SHA256SUMS 첫 컬럼 값. 비어있으면 검증 skip
agent_binary_local_sha256: ""

# --- 공통 ---
agent_install_path: "/usr/local/bin/assessment-agent"
