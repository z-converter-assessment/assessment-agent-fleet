- name: Render noise-agent-restart service
  ansible.builtin.template:
    src: noise-agent-restart.service.j2
    dest: /etc/systemd/system/noise-agent-restart.service
    mode: "0644"

- name: Render noise-agent-restart timer
  ansible.builtin.template:
    src: noise-agent-restart.timer.j2
    dest: /etc/systemd/system/noise-agent-restart.timer
    mode: "0644"

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and start noise-agent-restart.timer
  ansible.builtin.systemd_service:
    name: noise-agent-restart.timer
    enabled: true
    state: started
