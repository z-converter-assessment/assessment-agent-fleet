- name: Ensure agent config dir exists
  ansible.builtin.file:
    path: "{{ agent_config_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: "{{ agent_user }}"

- name: Render agent env file (non-secret)
  ansible.builtin.template:
    src: assessment-agent.env.j2
    dest: "{{ agent_env_path }}"
    mode: "0640"
    owner: root
    group: "{{ agent_user }}"
  notify: Restart assessment-agent

- name: Render agent env.local file (secret)
  ansible.builtin.template:
    src: assessment-agent.env.local.j2
    dest: "{{ agent_env_local_path }}"
    mode: "0640"
    owner: root
    group: "{{ agent_user }}"
  notify: Restart assessment-agent
  no_log: true
