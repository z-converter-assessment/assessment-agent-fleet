- name: Render systemd unit
  ansible.builtin.template:
    src: assessment-agent.service.j2
    dest: /etc/systemd/system/assessment-agent.service
    mode: "0644"
    owner: root
    group: root
  notify: Reload systemd

- name: Enable and start agent service
  ansible.builtin.systemd_service:
    name: assessment-agent
    enabled: true
    state: started
    daemon_reload: true
