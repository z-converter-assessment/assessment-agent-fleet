- name: Load OS family vars
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Enable EPEL (RHEL family — node_exporter 는 epel)
  when: service_monitor_needs_epel | bool
  ansible.builtin.package:
    name: epel-release
    state: present
  ignore_errors: true

- name: Install node exporter
  ansible.builtin.package:
    name: "{{ service_monitor_pkg }}"
    state: present

- name: Enable and start node exporter
  ansible.builtin.systemd_service:
    name: "{{ service_monitor_unit }}"
    enabled: true
    state: started
  failed_when: false
