- name: Enable EPEL (RHEL family — stress-ng 는 epel)
  when: ansible_os_family == "RedHat"
  ansible.builtin.package:
    name: epel-release
    state: present
  ignore_errors: true   # amazon linux 등 일부 distro epel-release 미존재 시 skip

- name: Install stress-ng
  ansible.builtin.package:
    name: "{{ noise_stress_pkg }}"
    state: present

- name: Deploy noise stress wrapper
  ansible.builtin.copy:
    src: noise-stress-wrapper.sh
    dest: /usr/local/bin/noise-stress-wrapper.sh
    mode: "0755"
    owner: root
    group: root
  register: noise_wrapper

- name: Render noise systemd unit
  ansible.builtin.template:
    src: noise-stress.service.j2
    dest: /etc/systemd/system/noise-stress.service
    mode: "0644"
    owner: root
    group: root
  register: noise_unit

- name: Reload systemd if unit or wrapper changed
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: noise_unit.changed or noise_wrapper.changed

- name: Enable and start noise-stress
  ansible.builtin.systemd_service:
    name: noise-stress
    enabled: true
    state: started

- name: Restart noise-stress if wrapper changed
  ansible.builtin.systemd_service:
    name: noise-stress
    state: restarted
  when: noise_wrapper.changed
